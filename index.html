<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
</head>
<link rel="stylesheet" href="./style.css">
<body>
    <div class="general">
        <div class="main">
            <div class="header">
            </div>
            <p class="head">To-Do List</p>
            <img class="a-z" src="./img/down_gray_arrow.svg" alt="click">
            <img class="a-zblack disnone" src="./img/dow_black_arrow.svg" >
            <img class="z-a disnone" src="./img/up_gray_arrow.svg" alt="">
            <img class="z-ablack disnone" src="./img/up_black_arrow.svg" alt="">
            <div class="inp">
                
                <input type="text">
                <img class="x-gray" src="./img/gray_cancel.svg" >
                <img class="x-gray x-purple" src="./img/purple_cancel.svg" >
            </div>
            <div class="list disnone">
                <ol></ol>
            </div>
            <img class="plus" src="./img/add_button.svg" alt="add">
        </div>

    </div>
    
</body>

</html>
<script src="./app.js"></script>
